<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PyScript Pygame-CE Demo</title>
    <link rel="stylesheet" href="https://pyscript.net/releases/2026.2.1/core.css" />
    <script type="module" src="https://pyscript.net/releases/2026.2.1/core.js"></script>
    <style>
      body {
        margin: 0;
        padding: 20px;
        background-color: #1a1a1a;
        color: white;
        font-family: Arial, sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      h1 {
        color: #4caf50;
      }
      #canvas {
        border: 2px solid #4caf50;
        background-color: black;
        image-rendering: pixelated;
        image-rendering: -moz-crisp-edges;
        image-rendering: crisp-edges;
      }
      .controls {
        margin-top: 20px;
        display: flex;
        gap: 10px;
      }
      button {
        padding: 10px 20px;
        background-color: #4caf50;
        color: white;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        font-size: 16px;
      }
      button:hover {
        background-color: #45a049;
      }
      .info {
        margin-top: 20px;
        text-align: center;
        color: #ccc;
      }
      #python-log {
        margin-top: 16px;
        width: 480px;
        background: #111;
        color: #eeeeee;
        border: 1px solid #333;
        border-radius: 4px;
        font-family: monospace;
        font-size: 12px;
        padding: 8px;
        resize: vertical;
      }
      #canvas-wrapper {
        position: relative;
      }
      #splash-overlay {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        pointer-events: none;
      }
      #splash-overlay img {
        width: 200px;
        height: 100px;
      }
      #splash-loading-text {
        color: #4caf50;
        font-size: 16px;
        animation: blink 1.6s ease-in-out infinite;
      }
      @keyframes blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.3; }
      }
      #splash-bar-track {
        width: 200px;
        height: 6px;
        background: #333;
        border-radius: 3px;
        overflow: hidden;
      }
      #splash-bar-indicator {
        width: 40px;
        height: 100%;
        background: #4caf50;
        border-radius: 3px;
        animation: slide 1s linear infinite;
      }
      @keyframes slide {
        from { transform: translateX(0); }
        to { transform: translateX(160px); }
      }
    </style>
  </head>
  <body>
    <h1 id="title">loading...</h1>
    <div id="canvas-wrapper">
      <canvas id="canvas" width="480" height="360"></canvas>
      <div id="splash-overlay">
        <img src="img/pygame_ce_logo.png" alt="Pygame CE" />
        <span id="splash-loading-text">Loading Pygame...</span>
        <div id="splash-bar-track">
          <div id="splash-bar-indicator"></div>
        </div>
      </div>
    </div>
    <div class="controls">
      <button id="resetBtn">Reset Game</button>
      <button id="pauseBtn">Pause</button>
    </div>
    <div class="info" id="info">&nbsp;</div>
    <textarea id="python-log" readonly rows="10"></textarea>

    <script type="py-game" src="main.py" config="pyscript.toml"></script>

    <script>
      window.addEventListener('py:all-done', () => {
        console.log('py:all-done');
      });

      const splash = document.querySelector('#splash-overlay');

      function removeSplash() {
        if (splash) splash.remove();
      }

      window.addEventListener('py:progress', (event) => {
        console.log('progress', event.detail);
        if (event.detail.includes('Loaded Pyodide')) {
          // removeSplash();
          // called from main.py
        }
      });

      // Fallback timeout
      // setTimeout(removeSplash, 10000);
    </script>
  </body>
</html>
